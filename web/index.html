<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🐕 Chess</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-row">
      <div class="board-wrap">
        <div id="game-over-toast" class="game-over-toast" aria-live="polite" aria-atomic="true"></div>
        <div id="board" class="board" aria-label="Chess board"></div>
      </div>

      <aside class="move-panel">
        <pre id="move-history" class="moves-list"></pre>
      </aside>
    </section>

    <section class="controls-row">
      <button id="btn-back" type="button">Take back</button>
      <button id="btn-flip" type="button">Flip sides</button>
      <button id="btn-restart" type="button">Restart</button>
      <button id="btn-load-fen" type="button">FEN</button>
    </section>
  </main>
  <div class="page-link-wrap">
    <a class="page-link" href="https://github.com/witaly-iwanow/fatpup-wasm" target="_blank" rel="noopener noreferrer">https://github.com/witaly-iwanow/fatpup-wasm</a>
  </div>

  <script src="app.js"></script>
  <script src="fatpup_wasm.js"></script>
</body>
</html>
