<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🐕 Chess</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-row">
      <div class="board-wrap">
        <div id="game-over-toast" class="game-over-toast" aria-live="polite" aria-atomic="true"></div>
        <div id="promotion-dialog" class="promotion-dialog" aria-hidden="true">
          <div class="promotion-card" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
            <div id="promotion-title" class="promotion-title">Choose a promotion piece</div>
            <div id="promotion-choices" class="promotion-choices"></div>
            <button id="promotion-cancel" class="promotion-cancel" type="button">Cancel</button>
          </div>
        </div>
        <div id="board" class="board" aria-label="Chess board"></div>
      </div>

      <aside class="move-panel">
        <pre id="move-history" class="moves-list"></pre>
      </aside>
    </section>

    <section class="controls-row">
      <button id="btn-back" type="button">Take back</button>
      <button id="btn-flip" type="button">Flip sides</button>
      <button id="btn-restart" type="button">Restart</button>
      <button id="btn-engine" type="button" title="Toggle engine strength">
        <span class="brain b1">&#129504;</span><span class="brain b2">&#129504;</span><span class="brain b3">&#129504;</span>
      </button>
      <button id="btn-copy-fen" type="button" title="Copy the current position as a FEN string">Copy FEN</button>
      <button id="btn-set-fen" type="button" title="Set the current position from a FEN string">Set FEN</button>
      <button id="btn-copy-pgn" type="button" title="Copy the game score in PGN format to the clipboard">PGN</button>
    </section>
    <div id="copy-toast" class="copy-toast" aria-live="polite" aria-atomic="true"></div>
  </main>
  <div class="page-link-wrap">
    <a class="page-link" href="https://github.com/witaly-iwanow/fatpup-wasm" target="_blank" rel="noopener noreferrer">https://github.com/witaly-iwanow/fatpup-wasm</a>
  </div>

  <script src="app.js"></script>
  <script src="fatpup_wasm.js"></script>
</body>
</html>
