  <!-- right ear -->
  <ellipse cx="48" cy="14" rx="8" ry="12" fill="#8B4513" transform="rotate(15 48 14)"/>
  <!-- left eye -->
  <circle cx="25" cy="26" r="3" fill="#1a1a1a"/>
  <!-- right eye -->
  <circle cx="39" cy="26" r="3" fill="#1a1a1a"/>
  <!-- snout -->
  <ellipse cx="32" cy="37" rx="10" ry="7" fill="#deb887"/>
  <!-- nose -->
